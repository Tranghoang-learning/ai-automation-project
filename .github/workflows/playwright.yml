
name: Playwright QA Tests

on:
  push:
    branches: [main, master, develop]

  pull_request:
    branches: [main, master, develop]

  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to test
        required: true
        type: choice
        options:
          - QA
          - Staging
          - UAT

      suite:
        description: Test suite to execute
        required: true
        type: choice
        options:
          - story
          - regression
          - sanity

permissions:
  contents: read

jobs:
  test:
    name: Run QA Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # QA uses QA; Staging and UAT use their own GitHub Environments.
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment == 'Staging' && 'Staging' || github.event_name == 'workflow_dispatch' && inputs.target_environment == 'UAT' && 'UAT' || 'QA' }}

    env:
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'QA' }}

      # Values are read from the selected GitHub Environment.
      QA_BASE_URL: ${{ vars.QA_BASE_URL }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      UAT_BASE_URL: ${{ vars.UAT_BASE_URL }}

    steps:
      - name: Validate environment and suite
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_ENV: ${{ inputs.target_environment }}
          SUITE: ${{ inputs.suite }}
        shell: bash
        run: |
          case "$SELECTED_ENV:$SUITE" in
            QA:story|Staging:regression|UAT:sanity)
              echo "Running $SUITE tests on $SELECTED_ENV"
              ;;
            *)
              echo "Invalid environment and suite combination."
              echo "QA requires story; Staging requires regression; UAT requires sanity."
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Configure target URL
        shell: bash
        run: |
          case "$TARGET_ENV" in
            QA)
              URL="$QA_BASE_URL"
              ;;
            Staging)
              URL="$STAGING_BASE_URL"
              ;;
            UAT)
              URL="$UAT_BASE_URL"
              ;;
            *)
              echo "Unsupported TARGET_ENV: $TARGET_ENV"
              exit 1
              ;;
          esac

          if [ -z "$URL" ]; then
            echo "Required URL variable is missing for $TARGET_ENV."
            echo "Check the variables in the selected GitHub Environment."
            exit 1
          fi

          # Make the selected URL available to subsequent steps.
          echo "BASE_URL=$URL" >> "$GITHUB_ENV"

      - name: Verify target configuration
        shell: bash
        run: |
          node -e '
            const url = process.env.BASE_URL;

            if (!url) {
              console.error(
                "BASE_URL is missing for " + process.env.TARGET_ENV
              );
              process.exit(1);
            }

            let parsed;
            try {
              parsed = new URL(url);
            } catch {
              console.error("BASE_URL is not a valid URL.");
              process.exit(1);
            }

            if (parsed.protocol !== "https:") {
              console.error("Target URL must use HTTPS.");
              process.exit(1);
            }

            console.log("Target environment:", process.env.TARGET_ENV);
            console.log("Target hostname:", parsed.hostname);
          '

      - name: List selected tests
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            npx playwright test --list --grep "@${{ inputs.suite }}"
          else
            npx playwright test --list --grep "@story"
          fi

      - name: Run Story Tests
        if: github.event_name != 'workflow_dispatch'
        run: npx playwright test --grep "@story"

      - name: Run Selected Suite
        if: github.event_name == 'workflow_dispatch'
        env:
          SUITE: ${{ inputs.suite }}
        run: npx playwright test --grep "@${SUITE}"

      - name: Upload Playwright Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
